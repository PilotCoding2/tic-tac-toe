<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <form id="welcome-form">
        <div class="game-title">
            <h1>Tic-Tac-Toe</h1>
        </div>
            <div id="player-one-form">
                <label for="player-one-name">Player One Name:</label>
                <input type="text" id="player-one-name" name="player-one-name" required>
            </div>
            <div id="player-two-form">
                <label for="player-two-name">Player Two Name:</label>
                <input type="text" id="player-two-name" name="player-two-name" required>
            </div>
            <div class="btn-container">
                <input type="submit" id="play-btn" value="Play!">
            </div>
        </form>
    <div id="players-container" class="invisible">
        <div id="player-one">
            <h2 class="player-one-name"></h2>
            <h3><span id="player-one-score">0</span></h3>
        </div>
        <div id="player-two">
            <h2 class="player-two-name"></h2>
            <h3><span id="player-two-score">0</span></h3>
        </div>
    </div>
    <div id="table" class="invisible">
        <div class="square" id="0-0"></div>
        <div class="square" id="0-1"></div>
        <div class="square" id="0-2"></div>
        <div class="square" id="1-0"></div>
        <div class="square" id="1-1"></div>
        <div class="square" id="1-2"></div>
        <div class="square" id="2-0"></div>
        <div class="square" id="2-1"></div>
        <div class="square" id="2-2"></div>
    </div>
</body>
</html>
